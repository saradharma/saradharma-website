<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaraDharma Razorpay Live Test</title>

<style>
    :root{
        --green:#064C2F;
        --green2:#3F704F;
        --gold:#C9972B;
        --cream:#FBF7ED;
        --text:#24332B;
        --error:#A52A2A;
    }

    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:var(--cream);
        font-family:Arial,Helvetica,sans-serif;
        color:var(--text);
    }

    .test-card{
        width:min(440px,92vw);
        background:#fff;
        border:1px solid var(--gold);
        border-radius:18px;
        padding:32px;
        box-shadow:0 12px 35px rgba(0,0,0,.10);
        text-align:center;
    }

    .logo-mark{
        font-family:Georgia,"Times New Roman",serif;
        font-size:30px;
        font-weight:bold;
        color:var(--green);
        margin-bottom:4px;
    }

    .subtitle{
        color:var(--green2);
        font-size:13px;
        margin-bottom:28px;
    }

    label{
        display:block;
        text-align:left;
        font-weight:bold;
        margin-bottom:8px;
        color:var(--green);
    }

    .amount-wrap{
        display:flex;
        align-items:center;
        border:1px solid #cfcfcf;
        border-radius:10px;
        overflow:hidden;
        margin-bottom:18px;
    }

    .currency{
        padding:14px 15px;
        background:#f2f2f2;
        font-size:18px;
        font-weight:bold;
    }

    input{
        width:100%;
        border:0;
        outline:0;
        padding:14px;
        font-size:18px;
        text-align:center;
    }

    button{
        width:100%;
        border:0;
        border-radius:10px;
        padding:14px 18px;
        background:var(--green);
        color:#fff;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        background:var(--green2);
    }

    button:disabled{
        opacity:.65;
        cursor:not-allowed;
    }

    .hint{
        font-size:12px;
        color:#666;
        margin-top:10px;
    }

    #status{
        display:none;
        margin-top:20px;
        padding:14px;
        border-radius:10px;
        font-size:14px;
        line-height:1.5;
        text-align:left;
    }

    #status.error{
        display:block;
        background:#fdecec;
        color:var(--error);
    }

    #success{
        display:none;
        margin-top:20px;
        padding:18px;
        border-radius:12px;
        background:#eaf7ee;
        border:1px solid #73b58a;
        color:var(--green);
    }

    .check{
        width:54px;
        height:54px;
        margin:0 auto 10px;
        border-radius:50%;
        background:var(--green);
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:30px;
        font-weight:bold;
    }

    .success-title{
        font-size:20px;
        font-weight:bold;
        margin-bottom:8px;
    }

    .details{
        font-size:12px;
        color:#466050;
        word-break:break-word;
    }
</style>
</head>

<body>

<div class="test-card">

    <div class="logo-mark">SaraDharma</div>
    <div class="subtitle">Razorpay Production Payment Test</div>

    <label for="amount">Enter amount</label>

    <div class="amount-wrap">
        <div class="currency">₹</div>
        <input
            id="amount"
            type="number"
            min="1"
            max="10"
            step="1"
            value="1"
            inputmode="numeric"
        >
    </div>

    <button id="payButton" type="button">
        Test Razorpay Payment
    </button>

    <div class="hint">
        Enter any amount from ₹1 to ₹10.
    </div>

    <div id="status"></div>

    <div id="success">
        <div class="check">✓</div>
        <div class="success-title">Payment Verified Successfully</div>
        <div class="details" id="successDetails"></div>
    </div>

</div>

<script>
"use strict";

/***********************************************************************
 * SARADHARMA PRODUCTION WEB APP
 ***********************************************************************/

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbzYx0gfnQNee5bfy5NB_b5u1yuF1ZeYG-DC3OvQsk6ZNDaYoufeXe7-criLkPA9zmBYHw/exec";


/***********************************************************************
 * HARD-CODED TEST INFORMATION
 *
 * The user only enters the amount.
 * These values are sent only to create the pending server record and
 * to prefill Razorpay Checkout.
 ***********************************************************************/

const TEST_DATA = {
    category: "SaraDharma Live Razorpay Test",
    donorName: "SaraDharma Razorpay Test",
    email: "pavilion.r.home@gmail.com",
    phone: "+919620834492",
    address: "Halasuru, Bengaluru, Karnataka, India",
    country: "India",
    receiptRequired: "NO"
};


/***********************************************************************
 * RAZORPAY CHECKOUT
 *
 * Razorpay provides checkout.js rather than a separate checkout CSS
 * file. The checkout UI itself is supplied by Razorpay.
 ***********************************************************************/

function loadRazorpayCheckout(){

    return new Promise(function(resolve,reject){

        if(typeof Razorpay !== "undefined"){
            resolve();
            return;
        }

        const script =
            document.createElement("script");

        script.src =
            "https://checkout.razorpay.com/v1/checkout.js";

        script.onload =
            function(){
                resolve();
            };

        script.onerror =
            function(){
                reject(
                    new Error(
                        "Unable to load Razorpay Checkout."
                    )
                );
            };

        document.head.appendChild(script);
    });
}


/***********************************************************************
 * GENERIC JSONP REQUEST
 ***********************************************************************/

function jsonpRequest(params, prefix){

    return new Promise(function(resolve,reject){

        const callbackName =
            prefix + "_" + Date.now();

        let script = null;

        window[callbackName] =
            function(result){

                delete window[callbackName];

                if(script && script.parentNode){
                    script.parentNode.removeChild(script);
                }

                if(!result || !result.success){

                    reject(
                        new Error(
                            result && result.message
                                ? result.message
                                : "SaraDharma payment server returned an error."
                        )
                    );

                    return;
                }

                resolve(result);
            };

        params.callback = callbackName;

        const query =
            Object.keys(params)
                .map(function(key){
                    return encodeURIComponent(key)
                        + "="
                        + encodeURIComponent(params[key] == null ? "" : params[key]);
                })
                .join("&");

        script =
            document.createElement("script");

        script.src =
            WEBAPP_URL + "?" + query;

        script.async = true;

        script.onerror =
            function(){

                delete window[callbackName];

                if(script && script.parentNode){
                    script.parentNode.removeChild(script);
                }

                reject(
                    new Error(
                        "Unable to contact the SaraDharma payment server."
                    )
                );
            };

        document.head.appendChild(script);
    });
}


/***********************************************************************
 * CREATE RAZORPAY ORDER
 ***********************************************************************/

function requestRazorpayOrder(amount){

    return jsonpRequest(
        {
            action: "testrazorpayorder",

            amount: amount,

            category:
                TEST_DATA.category,

            donorName:
                TEST_DATA.donorName,

            email:
                TEST_DATA.email,

            phone:
                TEST_DATA.phone,

            address:
                TEST_DATA.address,

            country:
                TEST_DATA.country,

            receiptRequired:
                TEST_DATA.receiptRequired
        },

        "testRazorpayOrderCallback"
    );
}


/***********************************************************************
 * SERVER-SIDE PAYMENT VERIFICATION
 *
 * Only Razorpay's three returned values are sent here.
 ***********************************************************************/

function verifyRazorpayPayment(paymentResponse){

    return jsonpRequest(
        {
            action:
                "testrazorpayverify",

            razorpay_payment_id:
                paymentResponse.razorpay_payment_id,

            razorpay_order_id:
                paymentResponse.razorpay_order_id,

            razorpay_signature:
                paymentResponse.razorpay_signature
        },

        "testRazorpayVerifyCallback"
    );
}


/***********************************************************************
 * START TEST PAYMENT
 ***********************************************************************/

async function startTestPayment(){

    const button =
        document.getElementById("payButton");

    const status =
        document.getElementById("status");

    const success =
        document.getElementById("success");

    const successDetails =
        document.getElementById("successDetails");

    status.style.display = "none";
    status.className = "";
    success.style.display = "none";

    const amount =
        Number(
            document.getElementById("amount").value
        );

    if(
        !Number.isInteger(amount) ||
        amount < 1 ||
        amount > 10
    ){

        status.className = "error";
        status.textContent =
            "Please enter an amount from ₹1 to ₹10.";

        return;
    }

    button.disabled = true;
    button.textContent = "Creating payment...";

    try{

        /***************************************************************
         * STEP 1 — CREATE SERVER-SIDE RAZORPAY ORDER
         ***************************************************************/

        const order =
            await requestRazorpayOrder(amount);

        if(
            !order ||
            !order.orderId ||
            !order.keyId
        ){

            throw new Error(
                "Razorpay order was not created."
            );
        }

        /***************************************************************
         * STEP 2 — LOAD OFFICIAL RAZORPAY CHECKOUT
         ***************************************************************/

        button.textContent =
            "Opening Razorpay...";

        await loadRazorpayCheckout();

        /***************************************************************
         * STEP 3 — OPEN RAZORPAY
         ***************************************************************/

        const options = {

            key:
                order.keyId,

            amount:
                order.amount,

            currency:
                order.currency,

            name:
                "SaraDharma Community",

            description:
                "SaraDharma Live Razorpay Test",

            order_id:
                order.orderId,

            prefill: {

                name:
                    TEST_DATA.donorName,

                email:
                    TEST_DATA.email,

                contact:
                    TEST_DATA.phone
            },

            notes: {

                donation_id:
                    order.referenceId,

                test:
                    "LIVE_RAZORPAY_TEST"
            },

            handler:
                async function(paymentResponse){

                    /********************************************************
                     * STEP 4 — SERVER-SIDE VERIFICATION
                     ********************************************************/

                    button.textContent =
                        "Verifying payment...";

                    try{

                        const result =
                            await verifyRazorpayPayment(
                                paymentResponse
                            );

                        if(
                            !result ||
                            !result.success
                        ){

                            throw new Error(
                                result &&
                                result.message
                                    ? result.message
                                    : "Payment verification failed."
                            );
                        }

                        /****************************************************
                         * STEP 5 — SUCCESS
                         ****************************************************/

                        button.disabled = false;
                        button.textContent =
                            "Test Razorpay Payment";

                        successDetails.innerHTML =
                            "Amount: ₹" +
                            amount.toLocaleString("en-IN") +
                            "<br>Payment ID: " +
                            paymentResponse.razorpay_payment_id +
                            "<br>Order ID: " +
                            paymentResponse.razorpay_order_id +
                            "<br>Reference: " +
                            (result.referenceId || order.referenceId);

                        success.style.display = "block";

                    }
                    catch(error){

                        button.disabled = false;
                        button.textContent =
                            "Test Razorpay Payment";

                        status.className = "error";
                        status.textContent =
                            error.message ||
                            "Server-side payment verification failed.";

                    }
                },

            modal: {

                ondismiss:
                    function(){

                        button.disabled = false;
                        button.textContent =
                            "Test Razorpay Payment";
                    }
            }
        };

        const razorpay =
            new Razorpay(options);

        razorpay.on(
            "payment.failed",
            function(response){

                button.disabled = false;
                button.textContent =
                    "Test Razorpay Payment";

                status.className = "error";
                status.textContent =
                    "Payment failed: " +
                    (
                        response.error &&
                        response.error.description
                            ? response.error.description
                            : "Please try again."
                    );
            }
        );

        razorpay.open();

    }
    catch(error){

        button.disabled = false;
        button.textContent =
            "Test Razorpay Payment";

        status.className = "error";
        status.textContent =
            error.message ||
            "Unable to start Razorpay payment.";
    }
}


document
    .getElementById("payButton")
    .addEventListener(
        "click",
        startTestPayment
    );

</script>

</body>
</html>
